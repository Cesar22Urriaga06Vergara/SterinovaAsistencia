services:
  - type: web
    name: sterinova-asistencia
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PORT
        value: 8000
      - key: SUPERADMIN_USER
        sync: false
      - key: SUPERADMIN_PASS
        sync: false
      - key: SUPERADMIN_NAME
        value: Super Administrador Sterinova


